<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<script src="../gate.js" data-sec="doc"></script>
<title>Detailed Report · GST</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/app.css">
<style>
:root{--wb-bengal:#F47A00}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--wb-bengal:#FF9A3D}}
:root[data-theme="dark"]{--wb-bengal:#FF9A3D}
body{background:var(--color-panel);min-height:100vh}
body::before{content:"";position:fixed;left:0;top:0;bottom:0;width:10px;background:var(--wb-bengal)}
.wrap{max-width:1100px;margin:0 auto;padding:40px 32px 64px 48px}
.back{font-size:14px;color:var(--color-fg-muted);text-decoration:none}
.back:hover{text-decoration:underline}
.kicker{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--color-fg-muted);margin:48px 0 18px;display:flex;align-items:center;gap:14px}
.kicker::before{content:"";width:44px;height:4px;border-radius:2px;background:var(--wb-bengal)}
h1{font:400 clamp(36px,5vw,56px)/1.08 var(--font-anthropic-serif);margin:0 0 18px}
p{font-size:17px;line-height:1.55}
.dl{display:inline-block;padding:10px 18px;border-radius:24px;border:2px solid var(--wb-bengal);color:var(--wb-bengal);font-weight:600;text-decoration:none}
.dl:hover{background:var(--wb-bengal);color:#fff}
.pdf{display:block;width:100%;height:80vh;margin-top:18px;border:1px solid var(--color-border-line);border-radius:8px}
@media (max-width:720px){.wrap{padding:28px 16px 48px 26px}body::before{width:6px}}
</style>
</head>
<body>
<main class="wrap">
  <a class="back" href="../">← GST · West Bengal</a>
  <p class="kicker">Report</p>
  <h1>Realising West Bengal’s GST Potential</h1>
  <p><a class="dl" href="Realising-West-Bengal-GST-Potential.pdf">Open the report (PDF)</a></p>
  <object class="pdf" data="Realising-West-Bengal-GST-Potential.pdf" type="application/pdf" aria-label="Detailed report"><p>The PDF cannot be shown here. <a href="Realising-West-Bengal-GST-Potential.pdf">Open it in a new tab.</a></p></object>
</main>
</body>
</html>
